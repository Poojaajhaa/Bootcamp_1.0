<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="text-center mb-4">CALCULATOR</h1>
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="form-group">
                <input id="first" type="number" class="form-control mb-3" placeholder="first number" />
            </div>
            <div class="form-group">
                <input id="second" type="number" class="form-control mb-3" placeholder="second number" />
            </div>
        </div>
    </div>
    <button class="btn btn-primary mr-2" onclick="add()">Add</button>
    <button class="btn btn-primary mr-2" onclick="sub()">Subtract</button>
    <button class="btn btn-primary mr-2" onclick="mul()">Multiply</button>
    <button class="btn btn-primary mr-2" onclick="div()">Divide</button>
    

    <div class="alert alert-success mt-3 text-center" id="response"></div>

    <script>
        async function add() {
            const a = document.getElementById("first").value;
            const b = document.getElementById("second").value;

            const res = await fetch("http://localhost:3002/sum/", {
                method : "POST" ,
                headers: {
                    "Content-Type" : "application/json"
                },
                body : JSON.stringify ({
                    a: a, 
                    b: b
                })
            });
            const json = await res.json()
            document.getElementById("response").innerHTML = json.ans;
        }

        async function sub() {
            const a = document.getElementById("first").value;
            const b = document.getElementById("second").value;

            const res = await fetch("http://localhost:3002/sub/", {
                method : "POST" ,
                headers : {
                    "Content-Type" : "application/json"
                },
                body : JSON.stringify ({
                    a: a,
                    b: b
                })
            });
            const json = await res.json()
            document.getElementById("response").innerHTML = json.ans;
        }


        async function mul() {
            const a = document.getElementById("first").value;
            const b = document.getElementById("second").value;

            const res = await fetch("http://localhost:3002/mul/", {
                method : "POST" ,
                headers : {
                    "Content-Type" : "application/json"
                },
                body : JSON.stringify ({
                    a: a,
                    b: b
                })
            });
            const json = await res.json()
            document.getElementById("response").innerHTML = json.ans;
        }


        async function div() {
            const a = document.getElementById("first").value;
            const b = document.getElementById("second").value;

            const res = await fetch("http://localhost:3002/div/", {
                method : "POST" ,
                headers : {
                    "Content-Type" : "application/json"
                },
                body : JSON.stringify ({
                    a: a,
                    b: b
                })
            });
            const json = await res.json()
            document.getElementById("response").innerHTML = json.ans;
        }

    </script>
</body>
</html>
